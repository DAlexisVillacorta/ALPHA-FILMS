<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Formulario Peliculas</title>
    <link rel="stylesheet" href="../Styles/form.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <link rel="stylesheet" href="/front/Styles/pagina.css">
    <link rel="stylesheet" href="/front/Styles/Reset.css">
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.3/dist/umd/popper.min.js" integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/js/bootstrap.min.js" integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy" crossorigin="anonymous"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body>
    <header>
        <div class="logo">
            <img src="/front/Styles/Icono_A.png" alt="Logo">
        </div>
        <h3>Alpha Films</h3>
        <ul class="nav justify-content-end">
            <li class="nav-item">
                <a class="nav-link active" href="https://es.wikipedia.org/wiki/Historia_del_cine">Historia del Cine</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">Sobre mi Proyecto</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="../index.html">HOME</a>
            </li>
        </ul>
    </header>

    <div class="CajaDeLogin">
        <h2>Añadir Peliculas</h2>
    
        <div id="message" class="alert" style="display: none;"></div>
        
        <form id="ingreso">
            <div class="cajaUsuario">
                <input type="text" name="" id="titulo" required>
                <label>TITULO</label>
            </div>
            
            <div class="cajaUsuario">
                <input type="number" name="" id="año" min="1900" max="2030" required>
                <label>AÑO</label>
            </div>
            
            <div class="cajaUsuario">
                <input type="text" name="" id="director" required>
                <label>DIRECTOR</label>
            </div>
            
            <div class="cajaUsuario">
                <input type="text" name="" id="duracion" placeholder="ej: 2h 16min" required>
                <label>DURACION</label>
            </div>

            <div class="generos-section">
                <label class="generos-title">GÉNEROS (selecciona uno o más):</label>
                <div class="generos-grid">
                    <div class="genero-item">
                        <input type="checkbox" id="accion" name="genero" value="Action">
                        <label for="accion">Acción</label>
                    </div>
                    <div class="genero-item">
                        <input type="checkbox" id="aventura" name="genero" value="Adventure">
                        <label for="aventura">Aventura</label>
                    </div>
                    <div class="genero-item">
                        <input type="checkbox" id="comedia" name="genero" value="Comedy">
                        <label for="comedia">Comedia</label>
                    </div>
                    <div class="genero-item">
                        <input type="checkbox" id="drama" name="genero" value="Drama">
                        <label for="drama">Drama</label>
                    </div>
                    <div class="genero-item">
                        <input type="checkbox" id="fantasia" name="genero" value="Fantasy">
                        <label for="fantasia">Fantasía</label>
                    </div>
                    <div class="genero-item">
                        <input type="checkbox" id="ciencia-ficcion" name="genero" value="Sci-Fi">
                        <label for="ciencia-ficcion">Ciencia Ficción</label>
                    </div>
                    <div class="genero-item">
                        <input type="checkbox" id="thriller" name="genero" value="Thriller">
                        <label for="thriller">Thriller</label>
                    </div>
                    <div class="genero-item">
                        <input type="checkbox" id="romance" name="genero" value="Romance">
                        <label for="romance">Romance</label>
                    </div>
                    <div class="genero-item">
                        <input type="checkbox" id="horror" name="genero" value="Horror">
                        <label for="horror">Terror</label>
                    </div>
                </div>
            </div>

            <div class="cajaUsuario">
                <input type="number" name="" id="rating" min="0" max="10" step="0.1" required>
                <label>RATING (0-10)</label>
            </div>

            <div class="cajaUsuario">
                <input type="url" name="" id="poster" required>
                <label>POSTER (URL)</label>
            </div>

            <button type="submit" id="submitBtn">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                Agregar Película
            </button>

            <button type="button" id="clear">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                Limpiar Formulario
            </button>
        </form>
    </div>

    
<footer class="bdark text-light py-5 mt-5 border-top border-secondary">
    <div class="container-fluid px-4">
        <div class="row justify-content-center">
            <!-- Columna de Soporte -->
            <div class="col-lg-3 col-md-4 col-sm-6 mb-4">
                <div class="footer-column h-100 d-flex flex-column">
                    <h4 class="text-danger fw-bold mb-3 text-uppercase">
                        <i class="fas fa-headset me-2"></i>Soporte
                    </h4>
                    <ul class="list-unstyled footer-links flex-grow-1">
                        <li class="mb-2">
                            <a href="#" class="text-light text-decoration-none d-flex align-items-center py-1 hover-link">
                                <i class="fas fa-question-circle me-2 text-muted"></i>
                                Centro de ayuda
                            </a>
                        </li>
                        <li class="mb-2">
                            <a href="#" class="text-light text-decoration-none d-flex align-items-center py-1 hover-link">
                                <i class="fas fa-envelope me-2 text-muted"></i>
                                Contacto
                            </a>
                        </li>
                        <li class="mb-2">
                            <a href="#" class="text-light text-decoration-none d-flex align-items-center py-1 hover-link">
                                <i class="fas fa-file-contract me-2 text-muted"></i>
                                Términos de uso
                            </a>
                        </li>
                        <li class="mb-2">
                            <a href="#" class="text-light text-decoration-none d-flex align-items-center py-1 hover-link">
                                <i class="fas fa-shield-alt me-2 text-muted"></i>
                                Privacidad
                            </a>
                        </li>
                    </ul>
                </div>
            </div>


    <script src="../public/form.bundle.js"></script>
</body>
</html>
